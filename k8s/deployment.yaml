apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudfgd
  labels:
    app: cloudfgd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudfgd
  template:
    metadata:
      labels:
        app: cloudfgd
    spec:
      containers:
        - name: app
          image: cloudfgd-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: SEARCH_TIMEOUT
              value: "10s"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
